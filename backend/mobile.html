<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental AI - Mobile Camera Scanner</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; text-align: center; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 360px; width: 100%; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.4; margin-bottom: 24px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 16px; background: #0284c7; color: white; font-weight: bold; font-size: 1.1rem; border: none; border-radius: 12px; cursor: pointer; box-sizing: border-box; }
        .btn:active { background: #0369a1; }
        input[type="file"] { display: none; }
        #status { margin-top: 16px; font-weight: 500; font-size: 0.95rem; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🦷 Dental AI Intake Scanner</h2>
        <p>Tap the button below to take a photo of the intake form. It will instantly stream to the desktop app!</p>
        
        <label for="cameraInput" class="btn">
            📸 Snap Document Photo
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">

        <div id="status"></div>
    </div>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const statusDiv = document.getElementById('status');

        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.className = '';
            statusDiv.innerHTML = '⏳ Uploading scan to desktop...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/v1/sync/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusDiv.className = 'success';
                    statusDiv.innerHTML = '✅ Form sent! Check desktop preview screen.';
                } else {
                    throw new Error('Upload failed');
                }
            } catch (err) {
                statusDiv.className = 'error';
                statusDiv.innerHTML = '❌ Connection error. Ensure phone is on same Wi-Fi.';
            }
        });
    </script>
</body>
</html>
